# The tools for building and testing Edgeway; `bin/setup` installs them.
#
# To use a Spinel checkout instead, point SPINEL at it in a
# mise.local.toml (git-ignored); SPINEL wins over spinel on PATH:
#
#   [env]
#   SPINEL = "{{ env.HOME }}/src/github.com/matz/spinel/spinel"

[plugins]
spinel = "https://github.com/y-yagi/mise-spinel"

[tools]
# For `edgeway build` (--target=wasm32-wasi). Its bin/ (clang, ar, ...) must
# not shadow the system's compilers, so bin_path points at a directory that
# doesn't exist and only WASI_SDK below says where it is.
"github:WebAssembly/wasi-sdk" = { version = "wasi-sdk-34", bin_path = "no-bin" }

# A commit of matz/spinel (mise-spinel builds any git ref from source):
# Edgeway needs fixes newer than the 2026.09.12 release. A commit rather than
# master, so an install (and CI's cache of it) is the Spinel that was tested.
# depends: the wasi-sdk is installed first, so the build also makes Spinel's
# wasm32-wasi runtime (mise-spinel does when WASI_SDK, set below, is there).
spinel = { version = "76d07464f", depends = ["github:WebAssembly/wasi-sdk"] }

[env]
# Empty when the WASI SDK isn't a tool here (CI disables it with
# MISE_DISABLE_TOOLS); `default` doesn't cover a missing tools[] entry.
WASI_SDK = { value = "{% if tools['github:WebAssembly/wasi-sdk'] is defined %}{{ tools['github:WebAssembly/wasi-sdk'].path }}{% endif %}", tools = true }
