name: Test

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Installing Spinel builds it from source; a cached install is quick.
    timeout-minutes: 10
    # The WASI SDK is disabled, not just left uninstalled: mise refuses to
    # install spinel while a tool in its `depends` is configured but missing.
    env:
      MISE_DISABLE_TOOLS: github:WebAssembly/wasi-sdk
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # `rake test` links libsqlite3 (SQLiteAdapter, via Spinel FFI); macOS has it.
      - name: Install libsqlite3-dev
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      # Spinel from mise.toml (the mise-spinel plugin). The WASI SDK is
      # skipped: the tests are native builds, and nothing here builds wasm.
      # (MISE_DISABLE_TOOLS above: leaving it out of install_args isn't enough.)
      - name: Install Spinel
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: spinel
      - name: Show Spinel
        run: |
          spinel --version
      # CRuby, Spinel native builds, the CLI, and js/cgi.js with node
      # (preinstalled on the runners).
      - name: Run the tests
        run: bundle exec rake test
